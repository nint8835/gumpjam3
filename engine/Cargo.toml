[package]
name = "engine"
version = "0.1.0"
authors = ["Riley Flynn <riley@rileyflynn.me>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
uiua = { version = "0.19.1", default-features = false, features = ["batteries", "web"] }
wasm-bindgen = "0.2.84"

# Manually add extra features needed to compile Uiua to WASM
# This appears to be an issue on Uiua's side that they aren't exposed to due to how they use workspaces
getrandom = { version = "*", features = ["wasm_js"]}
web-sys = { version = "*", features = ["Performance"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
